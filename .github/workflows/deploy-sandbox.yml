name: Deploy sandbox

# Publishes the sandbox to GitHub Pages:
#   /            Storybook (every component and state)
#   /playground/ the fake back-office app, to click around
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [claude/dsaasfr-component-library-vthch4, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-storybook --quiet --output-dir _site
      - run: pnpm build:playground
        env:
          PLAYGROUND_BASE: /${{ github.event.repository.name }}/playground/
      - run: cp -r dist-playground _site/playground
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
