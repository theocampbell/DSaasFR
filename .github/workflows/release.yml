name: Release

# On every push to `main` (merge of `develop`), semantic-release reads the conventional
# commits since the last release, computes the version, updates CHANGELOG.md and
# package.json, publishes @dsaasfr/vue to npm and creates the GitHub release.
# `next` publishes pre-releases on the `next` dist-tag.
#
# npm trusted publishing (OIDC): no npm token stored in GitHub; provenance is generated
# automatically. On npmjs.com the trusted publisher must point to this file (release.yml).

on:
  push:
    branches: [main, next]

permissions:
  contents: write        # push the release commit and tag
  issues: write          # comment on released issues
  pull-requests: write   # comment on released PRs
  id-token: write        # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
