name: Release

# Publishes @dsaasfr/vue to npm when a version tag is pushed (e.g. v0.1.1).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub; every release
# carries a provenance attestation linking it to this workflow run and commit.
# One-time setup on npmjs.com: package settings → Trusted publisher → GitHub Actions,
# repository theocampbell/DSaasFR, workflow release.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs a recent npm CLI.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm check
      - run: npm publish --access public --provenance
